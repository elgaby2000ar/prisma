<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PRISMA · puzzles de luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@600;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071a;--panel:#12122e;--line:#2a2a55;--txt:#e9e9ff;--dim:#8c8cc0;--red:#ff3b6b;--blue:#2fa8ff;--pur:#b34dff;--yel:#ffd23f;--ok:#3dffb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#1e1050 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;max-width:560px;margin:0 auto}
.screen.on{display:flex}
/* menú */
#menu{justify-content:center;align-items:center;padding:24px;gap:10px}
.logo{font-family:Orbitron;font-weight:900;font-size:56px;letter-spacing:6px;background:linear-gradient(90deg,var(--red),var(--pur),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(179,77,255,.55));margin:0}
.sub{color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin:-4px 0 18px}
.mbtn{width:100%;max-width:340px;display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;background:linear-gradient(180deg,#1a1a40,#121232);border:1px solid var(--line);font-weight:800;font-size:17px;text-align:left;transition:transform .08s}
.mbtn:active{transform:scale(.97)}
.mbtn .ic{font-size:24px;width:30px;text-align:center}
.mbtn small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:2px}
.mbtn.hot{border-color:#5b2a9a;box-shadow:0 0 22px rgba(179,77,255,.25)}
.row{display:flex;gap:10px;width:100%;max-width:340px}
.sbtn{flex:1;padding:11px;border-radius:12px;background:#15153a;border:1px solid var(--line);font-weight:600;font-size:14px}
/* barras */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.bar .ttl{flex:1;font-family:Orbitron;font-weight:600;font-size:16px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;background:#15153a;border:1px solid var(--line);font-size:18px;flex:none}
.stat{font-size:13px;color:var(--dim);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.stat b{color:var(--txt);font-size:15px}
.bottom{justify-content:center;padding-bottom:18px}
.abtn{padding:12px 18px;border-radius:14px;background:#17173d;border:1px solid var(--line);font-weight:800;font-size:15px}
.abtn.pri{background:linear-gradient(90deg,#7a2cff,#2f7bff);border:0;box-shadow:0 0 18px rgba(122,44,255,.4)}
.abtn:disabled{opacity:.4}
.tip{margin:0 14px;padding:10px 14px;border-radius:12px;background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.25);color:#ffe7a0;font-size:14px;line-height:1.35;display:none}
.tip.on{display:block}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;position:relative}
canvas{display:block;touch-action:none}
/* niveles */
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px 16px 24px;overflow:auto}
.lv{aspect-ratio:1;border-radius:14px;background:#15153a;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Orbitron;font-weight:900;font-size:18px}
.lv span{font-family:Inter;font-size:10px;letter-spacing:1px;color:var(--yel);margin-top:3px;min-height:12px}
.lv.lock{opacity:.35}
.lv.boss{border-color:#a8204a;background:linear-gradient(180deg,#3a1030,#1a0c26);box-shadow:0 0 14px rgba(255,59,107,.25)}
.whead{grid-column:1/-1;font-family:Orbitron;font-weight:600;font-size:13px;letter-spacing:2px;color:var(--dim);margin:10px 0 0;text-transform:uppercase}
.rank{font-size:13px;color:#cfcfff;background:#14143a;border:1px solid var(--line);padding:7px 14px;border-radius:999px;margin:-8px 0 12px}
.lv.done{border-color:#3a3a80}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,3,12,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(4px)}
#modal.on{display:flex}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#1a1a44,#10102a);border:1px solid #3a3a7a;border-radius:22px;padding:22px;text-align:center;box-shadow:0 0 40px rgba(122,44,255,.3);max-height:90vh;overflow:auto}
.card h2{font-family:Orbitron;margin:0 0 8px;font-size:22px}
.card p{color:#c8c8f0;line-height:1.45;font-size:15px;margin:8px 0}
.card .btns{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.stars{font-size:38px;letter-spacing:6px;margin:6px 0;color:var(--yel);text-shadow:0 0 14px rgba(255,210,63,.6)}
.stars i{font-style:normal;color:#33335a;text-shadow:none}
.code{font-family:ui-monospace,Menlo,monospace;background:#0a0a20;border:1px dashed #4a4a90;border-radius:10px;padding:10px;word-break:break-all;font-size:14px;color:#cfe;user-select:text;-webkit-user-select:text}
textarea,input[type=text]{width:100%;background:#0a0a20;border:1px solid #3a3a7a;border-radius:10px;color:var(--txt);padding:10px;font:14px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
a.abtn{text-decoration:none;display:block}
.how{text-align:left}
.how li{margin:6px 0;color:#c8c8f0;line-height:1.4}
/* editor */
.tools{display:flex;gap:7px;overflow-x:auto;padding:4px 14px 8px;flex:none;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;padding:9px 11px;border-radius:12px;background:#15153a;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.tool.on{border-color:var(--yel);box-shadow:0 0 12px rgba(255,210,63,.35);background:#232048}
.einfo{margin:0 14px;font-size:13px;color:var(--dim);min-height:36px;line-height:1.35}
.einfo b{color:var(--txt)}
select{background:#15153a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
/* online */
.uchip{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:#15153a;border:1px solid var(--line);font-weight:600;font-size:14px;max-width:60%}
.uchip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip:not(:has(.av)){padding:9px 14px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sbtn.big{padding:13px;font-size:15px;font-weight:800}
.scroll{flex:1;overflow:auto;padding:4px 16px 24px;min-height:0}
.lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{width:42px;height:42px;border-radius:12px;background:#15153a;border:2px solid transparent;font-size:22px}
.pick button.on{border-color:var(--yel)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.statgrid div{background:#15153a;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.statgrid b{display:block;font-size:20px}.statgrid span{font-size:12px;color:var(--dim)}
.urow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#13133a;border:1px solid var(--line);margin-bottom:7px}
.urow.mine{border-color:var(--yel);background:#24204a}
.urow .un{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.urow .un small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.urow .pos{width:26px;text-align:center;font-weight:800;color:var(--dim)}
.urow .val{font-size:14px;white-space:nowrap}
.urow .sbtn{flex:none;padding:8px 11px}
.sbtn.ok{background:#14503a;border-color:#2a8a5a}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;background:#15153a;border:1px solid var(--line);font-weight:700;font-size:13px}
.tabs button.on{border-color:var(--yel);background:#232048}
.muted{color:var(--dim);text-align:center;padding:24px 10px;line-height:1.4}
.chhead{display:flex;align-items:center;gap:10px;font-family:Inter;font-weight:800}
.msgs{flex:1;overflow:auto;padding:8px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{align-self:flex-start;max-width:78%;background:#1d1d48;border:1px solid var(--line);padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:15px;line-height:1.35;word-wrap:break-word;position:relative;user-select:text;-webkit-user-select:text}
.msg.me{align-self:flex-end;background:linear-gradient(90deg,#5a22d0,#2b63e0);border:0;border-radius:16px 16px 4px 16px}
.msg .rep{background:none;color:var(--dim);font-size:11px;margin-left:8px;padding:0}
.safety{font-size:12px;color:#ffe7a0;background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.2);border-radius:10px;padding:8px 10px;text-align:center;margin:0 0 6px}
.tcard{background:#13133a;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.tcard .th{display:flex;gap:10px;align-items:center}.tcard .un{flex:1;font-weight:800;text-align:left}.tcard .un small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.tcard .tf{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:10px 2px}
.tcard .tb{display:flex;gap:7px}.tcard .tb .pri{flex:1}.tcard .tb .abtn{padding:10px 13px}
/* duelo */
.dxbtn{padding:9px 14px;border-radius:12px;background:#1d1d48;border:1px solid #3a3a7a;font-weight:800;font-size:14px;color:var(--txt);flex:none}
#duel{max-width:none}
.half{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.half.top{transform:rotate(180deg)}
.dbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-family:Orbitron;font-weight:600;font-size:14px}
.p1 .dbar{color:var(--blue)} .p2 .dbar{color:var(--red)}
.pts{letter-spacing:4px;color:var(--yel)}
.mid{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:54px;padding:0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0c0c24;font-size:13px;color:var(--dim)}
.dover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,5,18,.75);font-family:Orbitron;font-weight:900;font-size:30px;text-align:center;z-index:5;gap:12px}
.dover.on{display:flex}
.dover small{font-family:Inter;font-weight:600;font-size:14px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#232350;border:1px solid #4a4a90;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
/* ===== Estética v2 ===== */
:root{--wa:#ff3b6b;--wb:#7a2cff}
body{background:radial-gradient(ellipse at 50% 120%,#3a0d5c 0%,#12062a 45%,#05040f 80%) fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none}
.screen{z-index:1}
.screen.on{animation:scrIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
/* logo */
.logowrap{display:flex;flex-direction:column;align-items:center;margin-top:30px}
.prismsvg{width:120px;height:62px;margin-bottom:-6px;filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.logo{font-family:Bungee,Orbitron,sans-serif;font-weight:400;font-size:58px;letter-spacing:4px;position:relative;line-height:1;
  background:linear-gradient(90deg,#ff3b6b,#ff9f1c,#ffd23f,#3dffb0,#2fa8ff,#b34dff,#ff3b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;filter:drop-shadow(0 0 22px rgba(179,77,255,.6)) drop-shadow(0 4px 0 #1a0838)}
@keyframes shine{to{background-position:200% 0}}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.8}
.logo::before{animation:glitchA 3.2s infinite steps(1);text-shadow:none;transform:translate(-3px,0);filter:hue-rotate(90deg)}
.logo::after{animation:glitchB 3.2s infinite steps(1);transform:translate(3px,0);filter:hue-rotate(-90deg)}
@keyframes glitchA{0%,86%,100%{clip-path:inset(0 0 100% 0)}87%{clip-path:inset(20% 0 55% 0)}89%{clip-path:inset(60% 0 10% 0)}91%{clip-path:inset(5% 0 80% 0)}93%{clip-path:inset(0 0 100% 0)}}
@keyframes glitchB{0%,88%,100%{clip-path:inset(0 0 100% 0)}89%{clip-path:inset(70% 0 5% 0)}91%{clip-path:inset(30% 0 45% 0)}94%{clip-path:inset(0 0 100% 0)}}
.sub{font-family:Orbitron;letter-spacing:6px;color:#c9b8ff;opacity:.8;margin:8px 0 14px;font-size:11px}
/* menú */
#menu{gap:9px;justify-content:flex-start;padding-top:30px;overflow-y:auto}
.mbtn{--ac:#ff3b6b;position:relative;overflow:hidden;max-width:360px;padding:13px 16px;border-radius:18px;
  background:linear-gradient(115deg,color-mix(in srgb,var(--ac) 22%,transparent),rgba(14,10,36,.88) 55%);
  border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 24px color-mix(in srgb,var(--ac) 18%,transparent);
  animation:popIn .5s backwards cubic-bezier(.2,1.4,.4,1);backdrop-filter:blur(6px)}
.mbtn .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
  background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 40%,#120830));box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 0 16px color-mix(in srgb,var(--ac) 45%,transparent)}
.mbtn div{font-family:Bungee,Inter;font-weight:400;font-size:18px;letter-spacing:.5px}
.mbtn small{font-family:Inter;font-weight:600;letter-spacing:0;color:#c9c3ec}
.mbtn:active{transform:translateY(3px) scale(.98);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.mbtn.hot::after{content:'';position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:sweep 3.5s infinite}
@keyframes sweep{0%,60%{left:-80px}100%{left:120%}}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
#mCamp{--ac:#ff3b6b;animation-delay:.05s}#mDaily{--ac:#ffb020;animation-delay:.1s}#mTrap{--ac:#b34dff;animation-delay:.15s}#mDuel{--ac:#2fa8ff;animation-delay:.2s}
.row{max-width:360px}
.sbtn{background:rgba(20,16,50,.85);border-color:#34306a;backdrop-filter:blur(6px)}
.sbtn.big{font-family:Bungee,Inter;font-weight:400;font-size:14px;letter-spacing:.5px}
.rank{background:rgba(20,16,50,.8);border-color:#4a3a8a;margin:0 0 8px}
.uchip{z-index:2;background:rgba(20,16,50,.85);backdrop-filter:blur(6px)}
/* barras y botones */
.bar .ttl{font-family:Bungee,Orbitron;font-weight:400;font-size:17px;letter-spacing:1px}
.bar .ttl small{display:block;font-family:Inter;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--wa);font-weight:800;margin-bottom:1px}
.ib{background:rgba(22,18,56,.9);border-color:#3a3478}
.abtn{background:rgba(24,20,60,.92);border:1px solid #3c3680;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.abtn.pri{background:linear-gradient(100deg,#ff3b6b,#b34dff 55%,#2f7bff);box-shadow:0 4px 0 #3a0f6a,0 0 22px rgba(179,77,255,.45);font-family:Bungee,Inter;font-weight:400;letter-spacing:.5px}
/* HUD */
.hud{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ebar{display:flex;gap:3px;align-items:center}
.ebar i{width:9px;height:16px;border-radius:3px;background:#2a2550;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.ebar i.on{background:linear-gradient(180deg,#fff27a,#ffb020);box-shadow:0 0 8px rgba(255,190,40,.7)}
.ebar.low i.on{background:linear-gradient(180deg,#ff8aa0,#ff2d55);box-shadow:0 0 10px rgba(255,45,85,.9);animation:blink .6s infinite}
.ebar b{font-family:Bungee;font-weight:400;font-size:15px;margin-right:4px;color:#ffd23f}
.ebar.low b{color:#ff5a7a}
@keyframes blink{50%{opacity:.45}}
.tchip{font-family:Bungee;font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(20,16,50,.9);border:1px solid #3a3478;color:#d8d2ff}
.tchip.hurry{color:#fff;background:#8a1030;border-color:#ff3b6b;animation:blink .5s infinite}
#gCv,#dCv1,#dCv2,#eCv{border-radius:16px;box-shadow:0 0 0 2px color-mix(in srgb,var(--wa) 45%,transparent),0 0 34px color-mix(in srgb,var(--wa) 28%,transparent),0 18px 40px rgba(0,0,0,.6)}
.tip{background:linear-gradient(100deg,rgba(255,210,63,.13),rgba(255,59,107,.08));border-color:rgba(255,210,63,.35)}
/* niveles */
.whead{font-family:Bungee;font-weight:400;font-size:15px;letter-spacing:1px;color:#fff;margin:14px 0 2px;padding:12px 14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(110deg,var(--ha),var(--hb));box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 24px color-mix(in srgb,var(--ha) 35%,transparent);text-transform:none;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.whead span{font-family:Inter;font-weight:800;font-size:12px;letter-spacing:0;background:rgba(0,0,0,.28);padding:4px 9px;border-radius:999px}
.lv{font-family:Bungee;font-weight:400;font-size:19px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--ha) 30%,#141038),#100c2c);border:1px solid color-mix(in srgb,var(--ha) 45%,transparent);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.lv:active{transform:translateY(3px)}
.lv.done{border-color:var(--ha)}
.lv.next{animation:pulse 1.4s infinite;border-color:#fff}
@keyframes pulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 22px color-mix(in srgb,var(--ha) 70%,transparent)}}
.lv.boss{background:radial-gradient(circle at 50% 40%,#6a0f2a,#1c0716);border-color:#ff3b6b;font-size:24px;animation:boss 2s infinite}
@keyframes boss{50%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 26px rgba(255,59,107,.7)}}
/* modal */
#modal{background:radial-gradient(circle at 50% 40%,rgba(40,10,80,.55),rgba(3,3,12,.85))}
#modal.on .card{animation:cardIn .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(170deg,#241a5a,#120c30 60%);border:1px solid #5a46b0;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 50px rgba(179,77,255,.35),0 20px 60px rgba(0,0,0,.6)}
.card h2{font-family:Bungee,Orbitron;font-weight:400;font-size:24px;letter-spacing:.5px;background:linear-gradient(90deg,#ffd23f,#ff7ab0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:0;margin:10px 0}
.stars .st{display:inline-block;font-size:50px;margin:0 4px;color:#2d2860;text-shadow:none}
.stars .st.on{color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.8),0 4px 0 #a86a00;animation:starIn .5s backwards cubic-bezier(.2,1.8,.4,1)}
.stars .st:nth-child(2){transform:translateY(-10px);font-size:58px}

<script>
// ================= Motor PRISMA =================
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
const REF = [[3, 2, 1, 0], [1, 0, 3, 2]]; // REF[o][d]: o=0 '/', o=1 '\'

function buildGrid(L) {
  const g = new Array(L.w * L.h).fill(null);
  for (const [x, y] of L.walls) g[y * L.w + x] = { k: 'W' };
  for (const [x, y] of L.bombs) g[y * L.w + x] = { k: 'B' };
  L.emitters.forEach((e, i) => g[e.y * L.w + e.x] = { k: 'E', i });
  L.targets.forEach((t, i) => g[t.y * L.w + t.x] = { k: 'T', i });
  L.pieces.forEach((p, i) => g[p.y * L.w + p.x] = { k: 'P', i });
  const ps = L.portals || [];
  ps.forEach((p, i) => {
    const m = ps.find((q, j) => j !== i && q.p === p.p);
    g[p.y * L.w + p.x] = { k: 'O', i, mx: m ? m.x : -1, my: m ? m.y : -1 };
  });
  return g;
}

function trace(L, grid, orient, wantSegs) {
  const W = L.w, H = L.h;
  const col = new Uint8Array(W * H);
  const seen = new Set();
  const segs = wantSegs ? [] : null;
  const stack = [];
  for (const e of L.emitters) stack.push([e.x, e.y, e.d, e.c]);
  let guard = 0;
  while (stack.length && guard++ < 5000) {
    let [x, y, d, c] = stack.pop();
    const sx = x, sy = y;
    while (true) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) {
        if (segs) segs.push([sx, sy, x + DX[d] * 0.5, y + DY[d] * 0.5, c]);
        break;
      }
      const cell = grid[ny * W + nx];
      const key = ((ny * W + nx) * 4 + d) * 4 + c;
      if (seen.has(key)) { if (segs) segs.push([sx, sy, nx, ny, c]); break; }
      seen.add(key);
      x = nx; y = ny;
      if (!cell || cell.k === 'T') { col[y * W + x] |= c; continue; }
      if (cell.k === 'W' || cell.k === 'E') {
        if (segs) segs.push([sx, sy, x - DX[d] * 0.5, y - DY[d] * 0.5, c]);
        break;
      }
      if (cell.k === 'B') { col[y * W + x] |= c; if (segs) segs.push([sx, sy, x, y, c]); break; }
      if (cell.k === 'O') {
        col[y * W + x] |= c; if (segs) segs.push([sx, sy, x, y, c]);
        if (cell.mx >= 0) { col[cell.my * W + cell.mx] |= c; stack.push([cell.mx, cell.my, d, c]); }
        break;
      }
      if (cell.k === 'P') {
        col[y * W + x] |= c;
        const p = L.pieces[cell.i], o = orient[cell.i];
        if (segs) segs.push([sx, sy, x, y, c]);
        stack.push([x, y, REF[o][d], c]);
        if (p.t === 's') stack.push([x, y, d, c]);
        break;
      }
    }
  }
  return { col, segs };
}

function isSolved(L, col) {
  for (const t of L.targets) if (col[t.y * L.w + t.x] !== t.c) return false;
  for (const [x, y] of L.bombs) if (col[y * L.w + x]) return false;
  return true;
}

// controles: cada pieza giratoria suelta es un control; las enlazadas (mismo g) comparten uno
function controls(L) {
  const C = [], byG = {};
  L.pieces.forEach((p, i) => {
    if (p.fixed) return;
    if (p.g) { if (byG[p.g] === undefined) { byG[p.g] = C.length; C.push([]); } C[byG[p.g]].push(i); }
    else C.push([i]);
  });
  return C;
}

// estados relativos a las orientaciones actuales de L.pieces
function enumerate(L, grid) {
  const C = controls(L), k = C.length, n = 1 << k, out = new Array(n);
  const base = L.pieces.map(p => p.o);
  for (let s = 0; s < n; s++) {
    const o = base.slice();
    for (let j = 0; j < k; j++) if ((s >> j) & 1) for (const m of C[j]) o[m] ^= 1;
    out[s] = trace(L, grid, o, false).col;
  }
  return { C, out };
}

function countSolutions(L) {
  const grid = buildGrid(L);
  const { C, out } = enumerate(L, grid);
  const sols = [];
  for (let s = 0; s < out.length; s++) if (isSolved(L, out[s])) sols.push(s);
  return { C, sols, out };
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function generate(seed, P) {
  const rnd = mulberry32(seed);
  const ri = n => Math.floor(rnd() * n);
  for (let att = 0; att < 500; att++) {
    const w = P.w, h = P.h, id = (x, y) => y * w + x;
    const L = { w, h, walls: [], bombs: [], emitters: [], targets: [], pieces: [], portals: [] };
    const used = new Set(), reserve = new Set();
    const free = (x, y) => !used.has(id(x, y)) && !reserve.has(id(x, y));
    const cols = P.colors === 2 ? [1, 2] : [1];
    if (P.extraEmit) cols.push(1 + ri(P.colors));
    let ok = true;
    for (const c of cols) {
      let placed = false;
      for (let t = 0; t < 60 && !placed; t++) {
        const side = ri(4); let x, y, d;
        if (side === 0) { x = 0; y = 1 + ri(h - 2); d = 0; }
        else if (side === 1) { x = w - 1; y = 1 + ri(h - 2); d = 2; }
        else if (side === 2) { y = 0; x = 1 + ri(w - 2); d = 1; }
        else { y = h - 1; x = 1 + ri(w - 2); d = 3; }
        if (free(x, y) && free(x + DX[d], y + DY[d])) { used.add(id(x, y)); reserve.add(id(x + DX[d], y + DY[d])); L.emitters.push({ x, y, d, c }); placed = true; }
      }
      if (!placed) ok = false;
    }
    if (!ok) continue;
    const randCell = inner => { for (let t = 0; t < 100; t++) { const x = inner ? 1 + ri(w - 2) : ri(w), y = inner ? 1 + ri(h - 2) : ri(h); if (free(x, y)) return [x, y]; } return null; };
    const addPiece = (t, fixed) => { const c = randCell(rnd() < 0.8); if (!c) return; used.add(id(c[0], c[1])); L.pieces.push({ x: c[0], y: c[1], t, o: ri(2), fixed, g: 0 }); };
    for (let i = 0; i < P.rot; i++) addPiece('m', false);
    for (let i = 0; i < (P.split || 0); i++) addPiece('s', false);
    for (let i = 0; i < (P.fixed || 0); i++) addPiece('m', true);
    for (let i = 0; i < (P.portals || 0); i++) for (let k = 0; k < 2; k++) { const c = randCell(true); if (c) { used.add(id(c[0], c[1])); L.portals.push({ x: c[0], y: c[1], p: i + 1 }); } }
    if (L.portals.length % 2) continue;
    for (let i = 0; i < (P.walls || 0); i++) { const c = randCell(false); if (c) { used.add(id(c[0], c[1])); L.walls.push(c); } }
    let grid = buildGrid(L);
    let tr = trace(L, grid, L.pieces.map(p => p.o), false).col;
    L.pieces = L.pieces.filter(p => tr[id(p.x, p.y)] > 0);
    const usedPairs = new Set(L.portals.filter(p => tr[id(p.x, p.y)] > 0).map(p => p.p));
    L.portals = L.portals.filter(p => usedPairs.has(p.p));
    if ((P.portals || 0) > 0 && usedPairs.size < 1) continue;
    const rotPieces = L.pieces.map((p, i) => i).filter(i => !L.pieces[i].fixed);
    if (rotPieces.length < Math.ceil((P.rot + (P.split || 0)) * 0.75) || rotPieces.length < 2) continue;
    if (P.colors === 2 && !L.pieces.some(p => tr[id(p.x, p.y)] === 3) && rnd() < 0.7) continue;
    // enlaces
    if (P.links) {
      const pool = rotPieces.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = ri(i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      for (let g = 1; g <= P.links && pool.length >= 2; g++) { L.pieces[pool.pop()].g = g; L.pieces[pool.pop()].g = g; }
    }
    grid = buildGrid(L);
    const { C, out } = enumerate(L, grid); // estado 0 = solución
    const solCol = out[0];
    const cand = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (grid[id(x, y)]) continue;
      const v = solCol[id(x, y)];
      cand.push(v ? { t: 'T', x, y, c: v } : { t: 'B', x, y });
    }
    let alive = []; for (let s = 0; s < out.length; s++) alive.push(s);
    const kills = (cd, s) => cd.t === 'T' ? out[s][id(cd.x, cd.y)] !== cd.c : out[s][id(cd.x, cd.y)] !== 0;
    const chosen = []; let nT = 0, nB = 0;
    while (alive.length > 1) {
      let best = null, bestK = 0;
      for (const cd of cand) {
        if (chosen.includes(cd)) continue;
        if (cd.t === 'T' && nT >= P.maxT) continue;
        if (cd.t === 'B' && nB >= P.maxB) continue;
        let k = 0; for (const s of alive) if (kills(cd, s)) k++;
        const sc = k * (cd.t === 'T' ? 1 : 0.9) * (0.75 + rnd() * 0.5) + (cd.t === 'T' && cd.c === 3 ? 2 : 0);
        if (k > 0 && sc > bestK) { bestK = sc; best = cd; }
      }
      if (!best) break;
      chosen.push(best); if (best.t === 'T') nT++; else nB++;
      alive = alive.filter(s => !kills(best, s));
    }
    if (alive.length !== 1 || nT < 1) continue;
    for (const cd of chosen) { if (cd.t === 'T') L.targets.push({ x: cd.x, y: cd.y, c: cd.c }); else L.bombs.push([cd.x, cd.y]); }
    for (let i = 0; i < (P.decoB || 0); i++) {
      const bc = cand.filter(cd => cd.t === 'B' && !chosen.includes(cd) && [0, 1, 2, 3].some(d => { const xx = cd.x + DX[d], yy = cd.y + DY[d]; return xx >= 0 && yy >= 0 && xx < w && yy < h && solCol[id(xx, yy)]; }));
      if (!bc.length) break; const b = bc[ri(bc.length)]; chosen.push(b); L.bombs.push([b.x, b.y]);
    }
    const k = C.length, flips = Math.max(P.minTaps || 2, Math.round(k * 0.7));
    if (flips > k) continue;
    const idx = C.map((_, j) => j); for (let i = idx.length - 1; i > 0; i--) { const j = ri(i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    for (let i = 0; i < flips; i++) for (const m of C[idx[i]]) L.pieces[m].o ^= 1;
    L.minTaps = flips; L.seed = seed;
    return L;
  }
  return null;
}

const TIERS = {
  t0: { w: 5, h: 5, rot: 3, maxT: 1, maxB: 1, colors: 1, decoB: 1, minTaps: 2 },
  t1: { w: 6, h: 6, rot: 4, fixed: 1, maxT: 2, maxB: 2, colors: 1, walls: 1, decoB: 1, minTaps: 3 },
  t2: { w: 6, h: 6, rot: 5, split: 1, fixed: 1, maxT: 2, maxB: 2, colors: 1, walls: 2, decoB: 1, minTaps: 3 },
  t3: { w: 6, h: 7, rot: 6, split: 1, fixed: 1, maxT: 3, maxB: 3, colors: 1, walls: 2, decoB: 2, minTaps: 4 },
  b1: { w: 7, h: 7, rot: 7, split: 2, fixed: 1, maxT: 3, maxB: 3, colors: 1, walls: 2, decoB: 2, minTaps: 5 },
  t4: { w: 6, h: 7, rot: 5, split: 1, portals: 1, maxT: 2, maxB: 2, colors: 1, walls: 2, decoB: 1, minTaps: 4 },
  t5: { w: 7, h: 7, rot: 6, split: 1, portals: 1, fixed: 1, maxT: 3, maxB: 3, colors: 1, walls: 2, decoB: 2, minTaps: 4 },
  t6: { w: 7, h: 7, rot: 6, split: 1, portals: 1, maxT: 3, maxB: 3, colors: 2, walls: 2, decoB: 1, minTaps: 5 },
  t7: { w: 7, h: 8, rot: 7, split: 2, portals: 1, fixed: 1, maxT: 4, maxB: 3, colors: 2, walls: 3, decoB: 2, minTaps: 5 },
  b2: { w: 8, h: 8, rot: 8, split: 2, portals: 2, fixed: 1, maxT: 4, maxB: 4, colors: 2, walls: 3, decoB: 2, minTaps: 6 },
  t8: { w: 7, h: 7, rot: 8, split: 1, portals: 1, links: 2, maxT: 3, maxB: 3, colors: 1, walls: 2, decoB: 2, minTaps: 4 },
  t9: { w: 7, h: 8, rot: 9, split: 1, portals: 1, links: 2, fixed: 1, maxT: 4, maxB: 3, colors: 2, walls: 2, decoB: 2, minTaps: 5 },
  t10: { w: 8, h: 8, rot: 10, split: 2, portals: 1, links: 3, fixed: 1, maxT: 4, maxB: 4, colors: 2, extraEmit: true, walls: 3, decoB: 2, minTaps: 6 },
  b3: { w: 8, h: 8, rot: 12, split: 2, portals: 2, links: 3, fixed: 1, maxT: 4, maxB: 4, colors: 2, extraEmit: true, walls: 3, decoB: 2, minTaps: 7 },
};
const CAMPAIGN = ['t0', 't1', 't1', 't2', 't2', 't3', 't3', 't3', 't3', 'b1',
  't4', 't4', 't5', 't5', 't6', 't6', 't7', 't7', 't7', 'b2',
  't8', 't8', 't9', 't9', 't9', 't10', 't10', 't10', 't10', 'b3'];
const WORLDS = [{ name: 'Mundo 1 · Neón', slack: 5, boss: 90 }, { name: 'Mundo 2 · Portales', slack: 4, boss: 120 }, { name: 'Mundo 3 · Enlaces', slack: 3, boss: 150 }];
function campaignLevel(n) {
  const P = TIERS[CAMPAIGN[n]];
  for (let s = 0; s < 60; s++) {
    const L = generate(1000 * (n + 1) + s * 7919 + 23, P);
    if (L) { const W = WORLDS[Math.floor(n / 10)]; L.limit = L.minTaps + W.slack; if (n % 10 === 9) L.timeLimit = W.boss; return L; }
  }
  return null;
}
function dailyLevel(dateNum) {
  const P = TIERS[['t6', 't7', 't9', 't10'][dateNum % 4]];
  for (let s = 0; s < 60; s++) { const L = generate(dateNum * 31 + s * 104729, P); if (L) return L; }
}

if (typeof module !== 'undefined') module.exports = { DX, DY, REF, buildGrid, trace, isSolved, controls, enumerate, countSolutions, mulberry32, generate, TIERS, CAMPAIGN, WORLDS, campaignLevel, dailyLevel };

</script>
<script>
// ================= utilidades =================

// ================= códigos para compartir =================
// celdas: a-z = tramos vacíos (1..26); W muro, X bomba, R/B/V objetivo, E-H láser rojo dir0-3, I-L láser azul, M/N espejo, S/T divisor, Y/Z espejo fijo
function encodeLevel(L, name) {
  const w = L.w, h = L.h, cells = new Array(w * h).fill(null);
  L.walls.forEach(([x, y]) => cells[y * w + x] = 'W');
  L.bombs.forEach(([x, y]) => cells[y * w + x] = 'X');
  L.targets.forEach(t => cells[t.y * w + t.x] = 'RBV'[t.c - 1]);
  L.emitters.forEach(e => cells[e.y * w + e.x] = (e.c === 1 ? 'EFGH' : 'IJKL')[e.d]);
  L.pieces.forEach(p => cells[p.y * w + p.x] = (p.fixed ? 'YZ'[p.o] : p.t === 's' ? 'ST'[p.o] : 'MN'[p.o]) + (p.g && !p.fixed ? p.g : ''));
  (L.portals || []).forEach(p => cells[p.y * w + p.x] = 'OQUA'[p.p - 1]);
  let s = 'P' + w + h, run = 0;
  for (const c of cells) { if (!c) { run++; if (run === 26) { s += 'z'; run = 0; } } else { if (run) s += String.fromCharCode(96 + run); run = 0; s += c; } }
  if (run) s += String.fromCharCode(96 + run);
  const nm = (name || '').normalize('NFD').replace(/[^A-Za-z0-9]/g, '').slice(0, 12);
  return nm ? s + '-' + nm : s;
}
function decodeLevel(str) {
  const m = String(str).match(/P([5-9])([5-9])([A-Za-z][A-Za-z0-9]*)(?:-([A-Za-z0-9]{1,12}))?/); if (!m) return null;
  const w = +m[1], h = +m[2], L = { w, h, walls: [], bombs: [], emitters: [], targets: [], pieces: [], portals: [] };
  let i = 0;
  for (const ch of m[3]) {
    if (ch >= 'a' && ch <= 'z') { i += ch.charCodeAt(0) - 96; continue; }
    if (ch >= '1' && ch <= '4') { const p = L.pieces[L.pieces.length - 1]; if (p && !p.fixed) p.g = +ch; continue; }
    if ('OQUA'.includes(ch)) { L.portals.push({ x: i % w, y: Math.floor(i / w), p: 'OQUA'.indexOf(ch) + 1 }); i++; continue; }
    const x = i % w, y = Math.floor(i / w); if (y >= h) return null;
    if (ch === 'W') L.walls.push([x, y]); else if (ch === 'X') L.bombs.push([x, y]);
    else if ('RBV'.includes(ch)) L.targets.push({ x, y, c: 'RBV'.indexOf(ch) + 1 });
    else if ('EFGH'.includes(ch)) L.emitters.push({ x, y, d: 'EFGH'.indexOf(ch), c: 1 });
    else if ('IJKL'.includes(ch)) L.emitters.push({ x, y, d: 'IJKL'.indexOf(ch), c: 2 });
    else if ('MN'.includes(ch)) L.pieces.push({ x, y, t: 'm', o: 'MN'.indexOf(ch), fixed: false });
    else if ('ST'.includes(ch)) L.pieces.push({ x, y, t: 's', o: 'ST'.indexOf(ch), fixed: false });
    else if ('YZ'.includes(ch)) L.pieces.push({ x, y, t: 'm', o: 'YZ'.indexOf(ch), fixed: true });
    else return null;
    i++;
  }
  if (!L.emitters.length || !L.targets.length) return null;
  if (!portalsOk(L)) return null;
  return { L, name: m[4] || '' };
}
function portalsOk(L) {
  const cnt = {}; (L.portals || []).forEach(p => cnt[p.p] = (cnt[p.p] || 0) + 1);
  return Object.values(cnt).every(v => v === 2);
}

const TIPS = [

  [L => L.pieces.some(p => p.t === 's'), 'El <b>divisor</b> (celeste) refleja el rayo y además lo deja pasar: ¡uno se vuelve dos!'],

const campCache = [];

}
function starsFor(b) { const extra = b.taps - b.minTaps; let s = extra <= 0 ? 3 : extra <= 2 ? 2 : 1; if (b.hints) s = Math.min(s, 2); return s; }

const RANKS = [[0, '✨', 'Chispa'], [10, '🔦', 'Linterna'], [25, '💡', 'Faro'], [45, '🔺', 'Prisma'], [65, '🌟', 'Supernova'], [85, '👑', 'Maestro de la Luz']];
function rankOf(st) { let i = 0; RANKS.forEach((r, j) => { if (st >= r[0]) i = j; }); const r = RANKS[i], nx = RANKS[i + 1]; return { i, ic: r[1], name: r[2], next: nx ? nx[0] : null }; }

function openLevels() {

    b.style.setProperty('--ha', wt.a);
    b.innerHTML = (open ? (boss ? '👹' : n + 1) : '🔒') + `<span>${'★'.repeat(s)}</span>`;
    if (open) b.onclick = () => playCamp(n);
    g.appendChild(b);

// ================= diario =================
function todayNum() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dailyIndex() { const d = new Date(); return Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2026, 10, 1)) / 864e5) + 1; }
function dailyShare(r) {
  const d = new Date();
  return `PRISMA 🔦 Desafío #${dailyIndex()} (${d.getDate()}/${d.getMonth() + 1})\n${'⭐'.repeat(r.stars)}${'▫️'.repeat(3 - r.stars)} ${r.taps} giros · ${fmt(r.time * 1000)}${streak() > 1 ? ' · 🔥' + streak() : ''}\n¿Podés superarme?`;
}
function streak() {
  let n = 0; const d = new Date();
  if (!store.daily[todayNum()]) d.setDate(d.getDate() - 1);
  while (true) { const k = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); if (!store.daily[k]) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
function playDaily() {
  const d = todayNum(), L = dailyLevel(d), done = store.daily[d];
  startGame(L, 'daily', 'Desafío #' + dailyIndex(), done ? 'Ya lo completaste hoy. Podés volver a jugarlo, pero cuenta tu primer resultado.' : 'Es el mismo puzzle para todos hoy. ¡Compará tu resultado con tus amigos!');
}

// ----- editor -----
const ed = { w: 7, h: 7, cells: [], tool: 'M', checked: null };
const TOOLS = [['M', '╱ Espejo'], ['S', '┆ Divisor'], ['ER', '🔴 Láser'], ['EB', '🔵 Láser'], ['T', '👾 Monstruo'], ['X', '💣 Bomba'], ['W', '▦ Muro'], ['F', '🔩 Fijo'], ['O', '🌀 Portal'], ['K', '🔗 Enlazar'], ['D', '🧽 Borrar']];
const eb = new Board($('eCv'), { editor: true, onCell: (x, y) => edCell(x, y) });
function openEditor() {
  if (!ed.cells.length) edReset(+$('eSize').value);
  const tb = $('eTools'); tb.innerHTML = '';
  TOOLS.forEach(([k, lab]) => { const b = document.createElement('button'); b.className = 'tool' + (ed.tool === k ? ' on' : ''); b.textContent = lab; b.onclick = () => { ed.tool = k; [...tb.children].forEach(c => c.classList.toggle('on', c === b)); edInfo(); }; tb.appendChild(b); });
  show('editor'); requestAnimationFrame(() => edSync());
}
function edReset(n) {
  ed.w = ed.h = n; ed.cells = new Array(n * n).fill(null);
  ed.cells[Math.floor(n / 2) * n] = { k: 'E', c: 1, d: 0 };
  ed.checked = null;
}
$('eSize').onchange = e => { edReset(+e.target.value); edSync(); };
$('eClear').onclick = () => { edReset(ed.w); edSync(); toast('Tablero limpio'); };
function edLevel() {
  const L = { w: ed.w, h: ed.h, walls: [], bombs: [], emitters: [], targets: [], pieces: [], portals: [] };
  ed.cells.forEach((c, i) => {
    if (!c) return; const x = i % ed.w, y = Math.floor(i / ed.w);
    if (c.k === 'W') L.walls.push([x, y]); else if (c.k === 'X') L.bombs.push([x, y]);
    else if (c.k === 'T') L.targets.push({ x, y, c: c.c }); else if (c.k === 'E') L.emitters.push({ x, y, d: c.d, c: c.c });
    else if (c.k === 'M') L.pieces.push({ x, y, t: 'm', o: c.o, fixed: false, g: c.g || 0 }); else if (c.k === 'S') L.pieces.push({ x, y, t: 's', o: c.o, fixed: false, g: c.g || 0 });
    else if (c.k === 'O') L.portals.push({ x, y, p: c.p });
    else if (c.k === 'F') L.pieces.push({ x, y, t: 'm', o: c.o, fixed: true });
  });
  return L;
}
function edSync() { eb.load(edLevel(), true); ed.checked = null; edInfo(); }
function edCell(x, y) {
  const i = y * ed.w + x, c = ed.cells[i], t = ed.tool;
  if (t === 'D') ed.cells[i] = null;
  else if (t === 'M' || t === 'S' || t === 'F') { if (c && c.k === t) c.o ^= 1; else ed.cells[i] = { k: t, o: 0 }; }
  else if (t === 'ER' || t === 'EB') { const col = t === 'ER' ? 1 : 2; if (c && c.k === 'E' && c.c === col) c.d = (c.d + 1) % 4; else ed.cells[i] = { k: 'E', c: col, d: 0 }; }
  else if (t === 'T') { if (c && c.k === 'T') c.c = c.c % 3 + 1; else ed.cells[i] = { k: 'T', c: 1 }; }
  else if (t === 'O') {
    if (c && c.k === 'O') { if (c.p < 4) c.p++; else ed.cells[i] = null; }
    else { const cnt = {}; ed.cells.forEach(q => { if (q && q.k === 'O') cnt[q.p] = (cnt[q.p] || 0) + 1; }); let p = 1; while (cnt[p] >= 2) p++; if (p > 4) { toast('Máximo 4 pares de portales'); return; } ed.cells[i] = { k: 'O', p }; }
  }
  else if (t === 'K') { if (c && (c.k === 'M' || c.k === 'S')) c.g = ((c.g || 0) + 1) % 4; else { toast('Tocá un espejo o divisor para enlazarlo'); return; } }
  else ed.cells[i] = (c && c.k === t) ? null : { k: t };
  if (controls(edLevel()).length > 12) { ed.cells[i] = c; toast('Máximo 12 piezas giratorias'); }
  sfx('tap'); edSync();
}
function edInfo() {
  const L = eb.L; if (!L) return;
  const hints = { M: 'Tocá una casilla para poner un espejo. Tocalo otra vez para girarlo.', S: 'El divisor refleja y deja pasar el rayo. Tocalo de nuevo para girarlo.', ER: 'Láser rojo: tocalo otra vez para cambiar su dirección.', EB: 'Láser azul: tocalo otra vez para cambiar su dirección.', T: 'Monstruo: tocalo de nuevo para cambiar su color (rojo, azul o violeta = rojo+azul).', X: 'Bomba: el rayo NO puede tocarla.', O: 'Portal: poné dos del mismo color. Tocalo de nuevo para cambiar de par.', K: 'Tocá espejos para enlazarlos: los del mismo número giran juntos. Tocá de nuevo para cambiar de grupo.', W: 'Muro: bloquea el rayo.', F: 'Espejo fijo: el que juega no lo puede girar.', D: 'Tocá una casilla para borrarla.' };
  const lit = L.targets.filter(t => eb.col[t.y * L.w + t.x] === t.c).length;
  $('eInfo').innerHTML = `${hints[ed.tool]}<br><b>Consejo:</b> armá el nivel ya resuelto (todos los monstruos electrocutados). Al compartirlo, el juego mezcla los espejos. · Monstruos: <b>${lit}/${L.targets.length}</b>`;
}
function edAnalyze() {
  const L = edLevel();
  if (!L.emitters.length) return { err: 'Poné al menos un láser.' };
  if (!L.targets.length) return { err: 'Poné al menos un monstruo 👾.' };
  if (!portalsOk(L)) return { err: 'Cada portal necesita su pareja: tiene que haber <b>exactamente dos</b> de cada color.' };
  const { C, sols } = countSolutions(L);
  if (!C.length) return { err: 'Agregá espejos o divisores que se puedan girar.' };
  if (!sols.length) return { err: 'Esta trampa <b>no tiene solución</b>. Probá con los espejos hasta que todos los monstruos queden electrocutados a la vez.' };
  // estado inicial: el más lejano a todas las soluciones
  let best = -1, bestS = [];
  for (let s = 0; s < (1 << C.length); s++) { let m = 99; for (const q of sols) m = Math.min(m, popc(s ^ q)); if (m > best) { best = m; bestS = [s]; } else if (m === best) bestS.push(s); }
  const start = bestS[Math.floor(Math.random() * bestS.length)];
  const P = clone(L); C.forEach((ms, j) => { if ((start >> j) & 1) ms.forEach(m => P.pieces[m].o ^= 1); });
  const score = Math.min(5, Math.max(1, Math.round((C.length / 3) + (sols.length === 1 ? 1.5 : 0) + L.bombs.length * .3 + (L.emitters.length > 1 ? 1 : 0) + (L.portals.length ? .5 : 0) + (L.pieces.some(p => p.g) ? .5 : 0) - (sols.length > 3 ? 1 : 0))));
  return { L: P, sols: sols.length, R: C.length, dist: best, score };
}

const duel = { s: [0, 0], round: 0, L: null, over: false };
const db1 = new Board($('dCv1'), { onSolve: () => duelWin(0) });
const db2 = new Board($('dCv2'), { rotated: true, onSolve: () => duelWin(1) });
function openDuel() { setTheme(0); duel.s = [0, 0]; duel.round = 0; show('duel'); duelRound(); }
function duelPts() { $('dS1').textContent = '●'.repeat(duel.s[0]) + '○'.repeat(2 - duel.s[0]); $('dS2').textContent = '●'.repeat(duel.s[1]) + '○'.repeat(2 - duel.s[1]); }
function duelRound() {
  duel.round++; duel.over = false; duelPts();
  $('dRound').textContent = 'Ronda ' + duel.round + ' · al mejor de 3';
  const tier = TIERS[['t3', 't5', 't6'][Math.min(duel.round - 1, 2)]];
  let L = null; while (!L) L = generate((Math.random() * 1e9) | 0, tier);
  duel.L = L;
  requestAnimationFrame(() => {
    db1.load(L); db2.load(L); db1.locked = db2.locked = true;
    let n = 3; const ov = [$('dO1'), $('dO2')];
    const tick = () => {
      ov.forEach(o => { o.innerHTML = n > 0 ? n : '¡YA!'; o.classList.add('on'); });
      sfx('beep');
      if (n > 0) { n--; setTimeout(tick, 700); }
      else setTimeout(() => { ov.forEach(o => o.classList.remove('on')); db1.locked = db2.locked = false; db1.t0 = db2.t0 = performance.now(); }, 450);
    };
    tick();
  });
}
function duelWin(p) {
  if (duel.over) return; duel.over = true;
  db1.locked = db2.locked = true;
  duel.s[p]++; duelPts(); sfx('win');
  const ov = [$('dO1'), $('dO2')];
  const champ = duel.s[p] >= 2;
  ov.forEach((o, i) => {
    o.innerHTML = (i === p ? (champ ? '🏆 ¡GANASTE EL DUELO!' : '¡Ronda para vos!') : (champ ? 'Perdiste el duelo 😵' : 'Te ganaron esta 😬')) +
      `<small>${champ ? '' : 'Siguiente ronda en un momento…'}</small>` + (champ ? '<button class="abtn pri dre">Revancha</button><button class="abtn dex">Salir</button>' : '');
    o.classList.add('on');
  });
  if (champ) {
    document.querySelectorAll('.dre').forEach(b => b.onclick = () => { ov.forEach(o => o.classList.remove('on')); openDuel(); });
    document.querySelectorAll('.dex').forEach(b => b.onclick = () => { ov.forEach(o => o.classList.remove('on')); show('menu'); });
  } else setTimeout(() => { ov.forEach(o => o.classList.remove('on')); duelRound(); }, 2200);
}
function duelPause(title, okLabel, onOk) {
  const was = duel.over; duel.over = true; db1.locked = db2.locked = true;
  modal(`<h2>${title}</h2><p>Se pierde el resultado de este duelo.</p><div class="btns"><button class="abtn pri" id="mx1">${okLabel}</button><button class="abtn" id="mx2">Seguir jugando</button></div>`);

}

    fr.forEach(u => {
      const d = document.createElement('div'); d.className = 'urow';
      d.innerHTML = `${av(u, 40)}<div class="un">${esc(u.name)}<small>${esc((u.rankName || ''))} · ${u.totalStars || 0} ★${u.streak ? ' · 🔥' + u.streak : ''}</small></div><button class="sbtn">💬</button><button class="sbtn">⋯</button>`;
      const [c, m] = d.querySelectorAll('button');
      c.onclick = () => openChat(u);
      m.onclick = () => friendMenu(u);
      $('frList').appendChild(d);
    });
  } catch (e) { console.error(e); $('frList').innerHTML = '<p class="muted">No se pudo cargar.</p>'; }
}
$('frAdd') && ($('frAdd').onclick = async () => {
  const code = $('frInput').value;
  if (code.trim().length !== 6) { toast('El código tiene 6 caracteres'); return; }
  const r = await ON.addFriend(code).catch(() => 'error');
  toast({ sent: 'Solicitud enviada ✓', accepted: '¡Ahora son amigos! 🎉', already: 'Ya son amigos', notfound: 'No existe ese código', self: 'Ese es tu propio código 😄', blocked: 'No se pudo enviar', error: 'No se pudo enviar' }[r]);
  $('frInput').value = ''; if (r === 'accepted') openFriends();
});
function friendMenu(u) {
  modal(`<div style="text-align:center">${av(u, 64)}</div><h2 style="margin-top:8px">${esc(u.name)}</h2><p>${esc(u.rankName || '')} · ${u.totalStars || 0} ★</p>
    <div class="btns"><button class="abtn pri" id="mx1">💬 Mensajes</button><button class="abtn" id="mx2">Eliminar amigo</button>
    <button class="abtn" id="mx3">🚫 Bloquear</button><button class="abtn" id="mx4" style="color:#ff6b8a">⚑ Denunciar</button><button class="abtn" onclick="closeModal()">Cerrar</button></div>`);
  $('mx1').onclick = () => { closeModal(); openChat(u); };
  $('mx2').onclick = async () => { await ON.removeFriend(u.uid); closeModal(); toast('Amigo eliminado'); openFriends(); };
  $('mx3').onclick = () => confirmBlock(u, openFriends);
  $('mx4').onclick = () => reportModal(u, '');
}
function confirmBlock(u, after) {
  modal(`<h2>¿Bloquear a ${esc(u.name)}?</h2><p>Deja de ser tu amigo, no te puede mandar mensajes ni solicitudes.</p>
    <div class="btns"><button class="abtn" id="mx1" style="background:#5a0a20">Bloquear</button><button class="abtn pri" onclick="closeModal()">Cancelar</button></div>`);
  $('mx1').onclick = async () => { await ON.block(u.uid); closeModal(); toast('Usuario bloqueado'); after && after(); };
}
function reportModal(u, text) {
  const R = ['Insultos o acoso', 'Contenido sexual', 'Me pidió datos personales o fotos', 'Spam', 'Otro'];
  modal(`<h2>⚑ Denunciar</h2><p>¿Qué pasó con <b>${esc(u.name)}</b>?</p><div class="btns">${R.map((r, i) => `<button class="abtn" data-i="${i}">${r}</button>`).join('')}<button class="abtn" onclick="closeModal()">Cancelar</button></div>
    <p style="font-size:12px;color:var(--dim)">Si alguien te incomoda o te pide fotos o datos, contáselo a un adulto de confianza.</p>`);
  $('mCard').querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
    await ON.report(u.uid, text, R[+b.dataset.i]).catch(() => { });
    modal(`<h2>Gracias por avisar</h2><p>Recibimos tu denuncia. ¿Querés bloquear también a ${esc(u.name)}?</p><div class="btns"><button class="abtn" id="mx1">🚫 Bloquear</button><button class="abtn pri" onclick="closeModal()">No, listo</button></div>`);
    $('mx1').onclick = () => confirmBlock(u, () => show('friends') || openFriends());
  });
}

// ----- chat -----
let chatU = null, chatUnsub = null;
const QUICK = ['¡Te reto! 😈', 'GG 🏆', '¿Duelo? ⚔️', 'Te mandé una trampa 💣', '¿Cuántas ★ tenés?', '😂', '🔥', '👏'];
function openChat(u) {
  chatU = u; show('chat');
  $('chHead').innerHTML = `${av(u, 32)}<span>${esc(u.name)}</span>`;
  $('chQuick').innerHTML = QUICK.map(q => `<button class="tool">${q}</button>`).join('');
  $('chQuick').onclick = e => { const b = e.target.closest('button'); if (b) sendChat(b.textContent); };
  $('chMsgs').innerHTML = '<p class="muted">Cargando…</p>';
  if (chatUnsub) chatUnsub();
  chatUnsub = ON.listenChat(u.uid, (msgs, err) => {
    if (!msgs) { $('chMsgs').innerHTML = '<p class="muted">No se pudieron cargar los mensajes.</p>'; return; }
    $('chMsgs').innerHTML = '<p class="safety">🔒 Solo tus amigos pueden escribirte. No compartas tu dirección, teléfono, fotos ni contraseñas.</p>' +
      msgs.map(m => `<div class="msg ${m.mine ? 'me' : ''}" data-t="${esc(m.text)}">${esc(m.text)}${m.mine ? '' : '<button class="rep" title="Denunciar">⚑</button>'}</div>`).join('');
    $('chMsgs').scrollTop = 1e9;
  });
}
$('chMsgs') && ($('chMsgs').onclick = e => { const r = e.target.closest('.rep'); if (r) reportModal(chatU, r.parentElement.dataset.t); });
async function sendChat(t) {
  t = (t || '').trim(); if (!t) return;
  try { await ON.send(chatU.uid, t); } catch (e) { toast('No se pudo enviar (¿siguen siendo amigos?)'); }
}
$('chSend') && ($('chSend').onclick = () => { const i = $('chInput'); sendChat(i.value); i.value = ''; });
$('chInput') && $('chInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('chSend').onclick(); });
$('chMore') && ($('chMore').onclick = () => friendMenu(chatU));
$('chBack') && ($('chBack').onclick = () => { if (chatUnsub) { chatUnsub(); chatUnsub = null; } openFriends(); });

// ----- trampas de la comunidad -----
let fdTab = 'new';
function openFeed(tab) {
  if (!needOnline()) return;
  fdTab = tab || fdTab; show('feed');
  document.querySelectorAll('#fdTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === fdTab));
  $('fdList').innerHTML = '<p class="muted">Cargando…</p>';
  ON.listTraps(fdTab === 'mine').then(list => {
    if (fdTab === 'mine') list.sort((a, b) => (b.at && b.at.seconds || 0) - (a.at && a.at.seconds || 0));
    if (!list.length) { $('fdList').innerHTML = `<p class="muted">${fdTab === 'mine' ? 'Todavía no publicaste trampas. Creá una en el editor y tocá “Publicar”.' : 'Todavía no hay trampas publicadas.'}</p>`; return; }
    $('fdList').innerHTML = '';
    list.forEach(t => {
      const d = document.createElement('div'); d.className = 'tcard';
      d.innerHTML = `<div class="th">${av({ avatar: t.avatar, color: t.color }, 34)}<div class="un">${esc(t.title)}<small>por ${esc(t.authorName)} · <span style="color:var(--yel)">${'★'.repeat(t.difficulty || 1)}</span></small></div></div>
        <div class="tf"><span>✅ ${t.solves} la resolvieron</span><span>${t.mySolve ? '🏅 Resuelta en ' + fmt(t.mySolve.time * 1000) : ''}</span></div>
        <div class="tb"><button class="abtn pri">▶ Jugar</button><button class="abtn lk">${t.myLike ? '❤️' : '🤍'} ${t.likes}</button>${t.author === me.uid ? '<button class="abtn">👥</button><button class="abtn">🗑️</button>' : ''}</div>`;
      const bs = d.querySelectorAll('.tb button');
      bs[0].onclick = () => playFeedTrap(t);
      bs[1].onclick = async () => { t.myLike = !t.myLike; t.likes += t.myLike ? 1 : -1; bs[1].textContent = (t.myLike ? '❤️ ' : '🤍 ') + t.likes; await ON.toggleLike(t.id, t.myLike).catch(() => { }); };
      if (bs[2]) bs[2].onclick = async () => { const s = await ON.trapSolvers(t.id); modal(`<h2>Quién la resolvió</h2>${s.length ? s.map(x => `<div class="urow">${av(x, 30)}<div class="un">${esc(x.name)}</div><b class="val">${fmt(x.time * 1000)} · ${x.taps}</b></div>`).join('') : '<p>Nadie todavía 😈</p>'}<div class="btns"><button class="abtn" onclick="closeModal()">Cerrar</button></div>`); };
      if (bs[3]) bs[3].onclick = async () => { await ON.deleteTrap(t.id); d.remove(); toast('Trampa borrada'); };
      $('fdList').appendChild(d);
    });
  }).catch(e => { console.error(e); $('fdList').innerHTML = '<p class="muted">No se pudo cargar.</p>'; });
}
function playFeedTrap(t) {
  const r = decodeLevel(t.code); if (!r) { toast('Trampa dañada'); return; }
  game.trapName = t.authorName; game.trapId = t.id;
  startGame(r.L, 'trap', t.title, `<b>${esc(t.authorName)}</b> publicó esta trampa. ¿La podés resolver?`);
}
window.publishTrapOnline = async (code, score) => {
  if (!needOnline()) return;
  modal(`<h2>🌐 Publicar en la comunidad</h2><p>Ponele un nombre a tu trampa:</p><input type="text" id="mxT" maxlength="40" placeholder="Ej: El laberinto del diablo">
    <div class="btns"><button class="abtn pri" id="mx1">Publicar</button><button class="abtn" onclick="closeModal()">Cancelar</button></div>`);
  $('mx1').onclick = async () => {
    try { await ON.publishTrap(code, $('mxT').value.trim() || 'Trampa sin nombre', score); closeModal(); toast('¡Trampa publicada! 😈'); openFeed('mine'); }
    catch (e) { toast('No se pudo publicar'); console.error(e); }
  };
};

// ----- arranque -----
$('mUser') && ($('mUser').onclick = () => me ? openProfile() : (ON.enabled ? loginModal() : needOnline()));
$('mRanks') && ($('mRanks').onclick = () => openRanks());
$('mFriends') && ($('mFriends').onclick = () => openFriends());
document.querySelectorAll('#rkTabs button').forEach(b => b.onclick = () => openRanks(b.dataset.t));
document.querySelectorAll('#fdTabs button').forEach(b => b.onclick = () => openFeed(b.dataset.t));
document.querySelectorAll('.back2').forEach(b => b.onclick = () => { refreshMenu(); show('menu'); });
let firstAuth = true;
ON.init(p => {
  me = p; renderUserChip();
  if (p) mergeCloud();
  if (!p && firstAuth && ON.enabled) { let seen = false; try { seen = localStorage.getItem('prisma_login_seen') === '1'; localStorage.setItem('prisma_login_seen', '1'); } catch (e) { } if (!seen) loginModal(true); }
  firstAuth = false;
  if (p && $('menu').classList.contains('on')) refreshMenu();
});
renderUserChip();

$('frCopy').onclick = e => copyText(`¡Agregame en PRISMA! Mi código de amigo es ${$('frCode').textContent}`, e.target);
$('frWa').onclick = () => { $('frWa').href = wa(`¡Agregame en PRISMA! 🔦 Mi código de amigo es ${$('frCode').textContent}`); };
</script>
</body>
</html>
